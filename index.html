<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rate Us ⭐ — Beri Ulasan di Google</title>
<meta name="description" content="Beri rating dan ulasan untuk tempat wisata kami di Google Maps. Terima kasih atas dukungannya!" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
  :root {
    --google-blue: #1a73e8;
    --google-red: #ea4335;
    --google-yellow: #fbbc04;
    --google-green: #34a853;
    --ink: #202124;
    --muted: #5f6368;
    --card-bg: rgba(255, 255, 255, 0.92);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Google Sans", "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 36px 20px 64px;
    background: linear-gradient(135deg, #e8f0fe 0%, #f1f8e9 45%, #fef7e0 100%);
    background-attachment: fixed;
    position: relative;
  }

  /* Latar belakang bergerak lembut */
  body::before {
    content: "";
    position: fixed;
    inset: -40%;
    background:
      radial-gradient(circle at 20% 30%, rgba(26, 115, 232, 0.12), transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(52, 168, 83, 0.12), transparent 40%),
      radial-gradient(circle at 60% 85%, rgba(251, 188, 4, 0.14), transparent 45%);
    animation: drift 18s ease-in-out infinite alternate;
    z-index: 0;
    pointer-events: none;
  }

  @keyframes drift {
    from { transform: translate3d(-2%, -1%, 0) scale(1); }
    to   { transform: translate3d(2%, 2%, 0) scale(1.08); }
  }

  .hero {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 640px;
    margin: 0 auto 40px;
    animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .g-logo { width: 54px; height: 54px; margin: 0 auto 10px; display: block; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--google-green);
    background: rgba(52, 168, 83, 0.1);
    border: 1px solid rgba(52, 168, 83, 0.25);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 42px;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 10px;
  }

  h1 .rate { color: var(--google-blue); }
  h1 .us   { color: var(--google-red); }

  .subtitle {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
  }
  .subtitle strong { color: var(--ink); }

  /* Grid tempat wisata */
  .grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
  }

  .spot-card {
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 20px;
    box-shadow: 0 10px 30px -14px rgba(32, 33, 36, 0.25);
    padding: 26px 22px 22px;
    text-align: center;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .spot-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 18px 40px -16px rgba(32, 33, 36, 0.32);
  }

  .spot-card .star-icon {
    font-size: 32px;
    line-height: 1;
    filter: drop-shadow(0 4px 10px rgba(251, 188, 4, 0.45));
  }

  .spot-card h2 {
    font-size: 19px;
    font-weight: 700;
    margin: 12px 0 16px;
    letter-spacing: -0.3px;
  }

  .btn-review {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--google-blue), #1557b0);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: 14px;
    padding: 13px 18px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 10px 24px -10px rgba(26, 115, 232, 0.6);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }
  .btn-review:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px -10px rgba(26, 115, 232, 0.7);
    filter: brightness(1.05);
  }
  .btn-review:active { transform: translateY(0) scale(0.99); }

  .page-link {
    display: block;
    margin-top: 13px;
    font-size: 12.5px;
    color: var(--google-blue);
    text-decoration: none;
  }
  .page-link:hover { text-decoration: underline; }

  .empty {
    position: relative;
    z-index: 1;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.8;
    padding: 40px 20px;
  }
  .empty a { color: var(--google-blue); }

  /* Tombol kecil ke panel admin */
  .admin-gear {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 5;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(32, 33, 36, 0.12);
    box-shadow: 0 6px 16px -6px rgba(32, 33, 36, 0.25);
    font-size: 18px;
    text-decoration: none;
    color: var(--muted);
    opacity: 0.75;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .admin-gear:hover { opacity: 1; transform: rotate(45deg) scale(1.08); }

  /* Toast */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(80px);
    background: #323232;
    color: #fff;
    font-size: 14px;
    padding: 14px 22px;
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    opacity: 0;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    z-index: 10;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 480px) {
    h1 { font-size: 34px; }
    .grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <header class="hero">
    <!-- Logo Google "G" -->
    <svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <div class="badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.3L12 16.8 5.8 21.2l2.4-7.3L2 9.4h7.6z"/>
      </svg>
      Google Reviews
    </div>
    <h1><span class="rate">Rate</span> <span class="us">Us</span></h1>
    <p class="subtitle">
      Puas dengan tempat wisata kami?<br />
      Pilih tempatnya &amp; beri <strong>rating &amp; ulasan</strong> untuk membantu kami berkembang 🙏
    </p>
  </header>

  <main class="grid" id="spotGrid" aria-live="polite"></main>

  <p class="empty" id="emptyState" hidden></p>

  <a class="admin-gear" href="admin.html" title="Panel Admin" aria-label="Panel Admin">⚙️</a>

  <div id="toast" class="toast" role="alert"></div>

<script>
  const grid = document.getElementById("spotGrid");
  const emptyState = document.getElementById("emptyState");

  let toastTimer;
  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 4000);
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function makeCard(spot, index) {
    const card = document.createElement("article");
    card.className = "spot-card";
    card.style.animationDelay = (0.06 * index).toFixed(2) + "s";

    const isPlaceholder = !spot.link || (spot.link || "").includes("YOUR_PLACE_ID");

    card.innerHTML =
      '<div class="star-icon" aria-hidden="true">⭐</div>' +
      "<h2>" + escapeHtml(spot.name || "Tanpa Nama") + "</h2>" +
      '<a class="btn-review" href="' + escapeHtml(spot.link || "#") +
        '" target="_blank" rel="noopener">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
          '<path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.3L12 16.8 5.8 21.2l2.4-7.3L2 9.4h7.6z"/>' +
        "</svg> Tulis Ulasan</a>" +
      '<a class="page-link" href="spot.html?id=' + encodeURIComponent(spot.id || "") +
        '">🔗 Halaman khusus (untuk QR code)</a>';

    const btn = card.querySelector(".btn-review");
    btn.addEventListener("click", (e) => {
      if (isPlaceholder) {
        e.preventDefault();
        showToast("⏳ Link untuk \u201C" + (spot.name || "tempat ini") +
          "\u201D belum diisi. Kelola di Panel Admin ya!");
      }
    });

    return card;
  }

  function showEmptyState(message) {
    emptyState.hidden = false;
    emptyState.innerHTML = message;
  }

  const EMPTY_MSG =
    "Belum ada tempat wisata terdaftar.<br>" +
    'Buka <a href="admin.html">Panel Admin</a> untuk menambahkan.';
  const ERROR_MSG =
    "⚠️ Data tempat wisata gagal dimuat.<br>" +
    "Coba muat ulang halaman ini.";

  async function loadSpots() {
    try {
      const res = await fetch("spots.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const spots = Array.isArray(data) ? data : (data && data.spots) || [];
      if (!spots.length) { showEmptyState(EMPTY_MSG); return; }
      spots.forEach((spot, i) => grid.appendChild(makeCard(spot, i)));
    } catch (err) {
      showEmptyState(ERROR_MSG);
    }
  }

  loadSpots();
</script>
</body>
</html>
