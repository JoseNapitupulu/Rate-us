<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rate Us ⭐ — Beri Ulasan di Google</title>
<meta name="description" content="Beri rating dan ulasan untuk kami di Google Maps. Terima kasih atas dukungannya!" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />

<!-- ============================================================
     ⭐ CARA MENGGANTI LINK REVIEW ⭐
     Cukup ganti nilai REVIEW_URL di bawah dengan link review
     Google Maps milikmu.

     Cara dapat link-nya:
     1. Cari bisnismu di Google Maps
     2. Buka https://googleplaceidfinder.com dan cari bisnismu
        untuk mendapatkan Place ID (contoh: ChIJN1t_tDeuEmsRUsoyG83frY4)
     3. Tempel di sini:
        "https://search.google.com/local/writereview?placeid=PLACE_ID_KAMU"

     Nama bisnis otomatis diambil dari Google, jadi tidak perlu
     diketik manual di halaman ini. 👍
     ============================================================ -->
<style>
  :root {
    --google-blue: #1a73e8;
    --google-red: #ea4335;
    --google-yellow: #fbbc04;
    --google-green: #34a853;
    --ink: #202124;
    --muted: #5f6368;
    --card-bg: rgba(255, 255, 255, 0.92);
    --shadow: 0 24px 60px -20px rgba(32, 33, 36, 0.28);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Google Sans", "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background: linear-gradient(135deg, #e8f0fe 0%, #f1f8e9 45%, #fef7e0 100%);
    position: relative;
    overflow: hidden;
  }

  /* Latar belakang bergerak lembut */
  body::before {
    content: "";
    position: absolute;
    inset: -40%;
    background:
      radial-gradient(circle at 20% 30%, rgba(26, 115, 232, 0.12), transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(52, 168, 83, 0.12), transparent 40%),
      radial-gradient(circle at 60% 85%, rgba(251, 188, 4, 0.14), transparent 45%);
    animation: drift 18s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes drift {
    from { transform: translate3d(-2%, -1%, 0) scale(1); }
    to   { transform: translate3d(2%, 2%, 0) scale(1.08); }
  }

  /* Bintang-bintang mengambang */
  .floating-star {
    position: absolute;
    color: var(--google-yellow);
    opacity: 0.28;
    animation: floaty 6s ease-in-out infinite;
    z-index: 0;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
    pointer-events: none;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-18px) rotate(10deg); }
  }

  .card {
    position: relative;
    z-index: 1;
    max-width: 520px;
    width: 100%;
    background: var(--card-bg);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 28px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255, 255, 255, 0.7);
    padding: 48px 40px 40px;
    text-align: center;
    animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Logo Google "G" (SVG resmi) */
  .g-logo { width: 56px; height: 56px; margin: 0 auto 6px; display: block; }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--google-green);
    background: rgba(52, 168, 83, 0.1);
    border: 1px solid rgba(52, 168, 83, 0.25);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 18px;
  }

  h1 {
    font-size: 44px;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -1px;
    margin-bottom: 10px;
  }

  h1 .rate { color: var(--google-blue); }
  h1 .us   { color: var(--google-red); }

  .subtitle {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 26px;
  }

  .subtitle strong { color: var(--ink); }

  /* Bintang */
  .stars {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
    font-size: 40px;
  }
  .stars span {
    color: #e3e3e3;
    text-shadow: 0 2px 6px rgba(32, 33, 36, 0.12);
    animation: pop 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .stars span.filled { color: var(--google-yellow); }
  .stars span:nth-child(1) { animation-delay: 0.35s; }
  .stars span:nth-child(2) { animation-delay: 0.45s; }
  .stars span:nth-child(3) { animation-delay: 0.55s; }
  .stars span:nth-child(4) { animation-delay: 0.65s; }
  .stars span:nth-child(5) { animation-delay: 0.75s; }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.2) rotate(-20deg); }
    to   { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  .rating-note {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 30px;
  }

  /* Tombol utama */
  .btn-review {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: linear-gradient(135deg, var(--google-blue), #1557b0);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: 16px;
    padding: 18px 24px;
    cursor: pointer;
    box-shadow: 0 12px 28px -10px rgba(26, 115, 232, 0.6);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    text-decoration: none;
  }
  .btn-review:hover {
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 18px 34px -10px rgba(26, 115, 232, 0.7);
    filter: brightness(1.05);
  }
  .btn-review:active { transform: translateY(0) scale(0.99); }
  .btn-review svg { flex-shrink: 0; }

  .hint {
    margin-top: 16px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
  }
  .hint code {
    background: rgba(32, 33, 36, 0.06);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 11.5px;
  }

  /* Toast peringatan (kalau link belum diganti) */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(80px);
    background: #323232;
    color: #fff;
    font-size: 14px;
    padding: 14px 22px;
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    opacity: 0;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    z-index: 10;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 480px) {
    .card { padding: 36px 22px 30px; }
    h1 { font-size: 34px; }
    .stars { font-size: 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

  <!-- Bintang dekoratif mengambang -->
  <span class="floating-star" aria-hidden="true" style="top:12%; left:8%;  font-size:34px;">★</span>
  <span class="floating-star" aria-hidden="true" style="top:22%; right:10%; font-size:22px; animation-delay:-2s;">★</span>
  <span class="floating-star" aria-hidden="true" style="bottom:18%; left:14%; font-size:26px; animation-delay:-4s;">★</span>
  <span class="floating-star" aria-hidden="true" style="bottom:10%; right:20%; font-size:18px; animation-delay:-1s;">★</span>
  <span class="floating-star" aria-hidden="true" style="top:55%; left:4%;  font-size:20px; animation-delay:-3s;">★</span>

  <main class="card">
    <!-- Logo Google "G" -->
    <svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>

    <div class="badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.3L12 16.8 5.8 21.2l2.4-7.3L2 9.4h7.6z"/>
      </svg>
      Google Reviews
    </div>

    <h1><span class="rate">Rate</span> <span class="us">Us</span></h1>
    <p class="subtitle">
      Puas dengan pelayanan kami?<br />
      Beri <strong>rating &amp; ulasan</strong> untuk membantu kami berkembang. 🙏
    </p>

    <div class="stars" aria-label="Rating 5 dari 5 bintang">
      <span class="filled">★</span>
      <span class="filled">★</span>
      <span class="filled">★</span>
      <span class="filled">★</span>
      <span class="filled">★</span>
    </div>
    <p class="rating-note">Lihat rating &amp; ulasan kami langsung di Google</p>

    <a id="reviewBtn" class="btn-review" href="#" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.3L12 16.8 5.8 21.2l2.4-7.3L2 9.4h7.6z"/>
      </svg>
      Tulis Ulasan di Google
    </a>

    <p class="hint">
      Membuka formulir ulasan resmi Google · butuh <code>&lt; 1 menit</code>
    </p>
  </main>

  <div id="toast" class="toast" role="alert"></div>

<script>
  /* ============================================================
     ⭐ GANTI LINK REVIEW DI SINI (SATU TEMPAT SAJA) ⭐
     ------------------------------------------------------------
     Contoh link yang benar:
     "https://search.google.com/local/writereview?placeid=ChIJN1t_tDeuEmsRUsoyG83frY4"

     Cara dapat Place ID:
     1. Buka Google Maps → cari bisnismu
     2. Buka https://googleplaceidfinder.com → cari bisnismu
     3. Salin Place ID-nya (contoh: ChIJN1t_tDeuEmsRUsoyG83frY4)
     4. Tempel di link bawah ini menggantikan YOUR_PLACE_ID
     ============================================================ */
  const REVIEW_URL = "https://search.google.com/local/writereview?placeid=YOUR_PLACE_ID";

  const btn = document.getElementById("reviewBtn");
  const toast = document.getElementById("toast");

  let toastTimer;

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 4000);
  }

  btn.addEventListener("click", (e) => {
    // Jika link masih placeholder, beri tahu pengunjung lewat toast.
    if (REVIEW_URL.includes("YOUR_PLACE_ID")) {
      e.preventDefault();
      showToast("⏳ Link review belum diisi. Cek file index.html bagian REVIEW_URL ya!");
      return;
    }
    btn.href = REVIEW_URL;
  });
</script>
</body>
</html>
