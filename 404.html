<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Halaman Tidak Ditemukan</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
  :root {
    --google-blue: #1a73e8;
    --google-yellow: #fbbc04;
    --ink: #202124;
    --muted: #5f6368;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Google Sans", "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background: linear-gradient(135deg, #e8f0fe 0%, #f1f8e9 45%, #fef7e0 100%);
    text-align: center;
  }
  .card {
    max-width: 440px;
    width: 100%;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 28px;
    box-shadow: 0 24px 60px -20px rgba(32, 33, 36, 0.28);
    padding: 48px 36px 40px;
    animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .star {
    display: inline-block;
    font-size: 56px;
    line-height: 1;
    color: var(--google-yellow);
    filter: drop-shadow(0 6px 14px rgba(251, 188, 4, 0.45));
    margin-bottom: 8px;
  }
  h1 {
    font-size: 88px;
    font-weight: 800;
    letter-spacing: -4px;
    line-height: 1;
    background: linear-gradient(135deg, var(--google-blue), #1557b0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
  }
  h2 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  p {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .btn-home {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--google-blue), #1557b0);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: 14px;
    padding: 15px 28px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 12px 28px -10px rgba(26, 115, 232, 0.6);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .btn-home:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 34px -10px rgba(26, 115, 232, 0.7);
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="star" aria-hidden="true">⭐</span>
    <h1>404</h1>
    <h2>Halaman tidak ditemukan</h2>
    <p>Sepertinya link-nya salah atau halaman ini sudah dipindah. Tenang, kamu bisa kembali ke beranda. 😊</p>
    <a id="home" class="btn-home" href="./">
      ← Kembali ke Beranda
    </a>
  </main>

<script>
  // Link beranda dihitung otomatis agar tetap benar walau diakses
  // dari path mana pun (user pages "/" maupun project pages "/repo/").
  document.getElementById("home").href =
    location.pathname.replace(/\/[^/]*\/?$/, "/");
</script>
</body>
</html>
